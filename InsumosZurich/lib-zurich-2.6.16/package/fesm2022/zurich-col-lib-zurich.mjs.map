<za-password-input
  label="{{label}}"
  [config]="lineType? 'line': ''"
  [required]="required"
  [readonly]="readonly"
  [disabled]="disabled"
  [invalid]="invalid"
  help-text="{{helpText}}"
  [(ngModel)]="model"
  (ngModelChange)="modelChange.emit(model)"
  [id]="name"
  [name]="name"
/>
