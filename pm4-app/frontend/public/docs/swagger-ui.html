<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartsupervisión API · Swagger UI</title>
<link rel="stylesheet" href="swagger/swagger-ui.css">
<style>
  :root{
    --bg2:#151b2b; --panel:#1a2234; --panel2:#212b41; --border:#2b3650; --border2:#39456a;
    --txt:#e7ecf5; --muted:#9aa7c4; --accent:#4f7cff;
    --mono:'SF Mono',ui-monospace,'Cascadia Code','Consolas',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg)}
  /* Barra superior oscura, a juego con la doc navegable */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;font-family:var(--sans)}
  .topbar .title{color:var(--txt);font-size:15px;font-weight:700;margin-right:auto}
  .topbar .title small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:600;
    color:var(--muted);background:var(--panel);border:1px solid var(--border2);border-radius:7px;
    cursor:pointer;text-decoration:none;transition:all .15s;font-family:var(--sans)}
  .tbtn:hover{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  .tbtn span{font-size:14px;line-height:1}
  /* Ocultamos la topbar propia de Swagger (redundante) */
  .swagger-ui .topbar{display:none}
  #swagger{max-width:1200px;margin:0 auto}
  .loading{font-family:var(--sans);color:var(--muted);text-align:center;padding:60px 20px}

  /* ============================================================
     TEMA OSCURO para Swagger UI (override del CSS claro por defecto)
     Paleta alineada con la doc navegable de Smartsupervisión.
     ============================================================ */
  :root{ --bg:#0f1420; --code-bg:#0b1020; --green:#22a06b; }
  .swagger-ui{ color:var(--txt); }
  .swagger-ui,
  .swagger-ui .info li,.swagger-ui .info p,.swagger-ui .info table,
  .swagger-ui .info .title,.swagger-ui .info h1,.swagger-ui .info h2,
  .swagger-ui .info h3,.swagger-ui .info h4,.swagger-ui .info h5,
  .swagger-ui label,.swagger-ui .opblock-tag,.swagger-ui .opblock-tag small,
  .swagger-ui .opblock .opblock-summary-operation-id,
  .swagger-ui .opblock .opblock-summary-path,
  .swagger-ui .opblock .opblock-summary-path__deprecated,
  .swagger-ui .opblock .opblock-summary-description,
  .swagger-ui .opblock-description-wrapper p,.swagger-ui .opblock-external-docs-wrapper p,
  .swagger-ui .opblock-title_normal p,
  .swagger-ui .opblock-section-header h4,.swagger-ui .opblock-section-header>label,
  .swagger-ui .tab li,.swagger-ui .parameter__name,.swagger-ui .parameter__type,
  .swagger-ui .parameter__in,.swagger-ui table thead tr td,.swagger-ui table thead tr th,
  .swagger-ui .response-col_status,.swagger-ui .response-col_links,
  .swagger-ui .responses-inner h4,.swagger-ui .responses-inner h5,
  .swagger-ui .model,.swagger-ui .model-title,.swagger-ui section.models h4,
  .swagger-ui .models-control,.swagger-ui .parameter__name.required span,
  .swagger-ui .dialog-ux .modal-ux-content h4,.swagger-ui .dialog-ux .modal-ux-header h3,
  .swagger-ui .servers-title,.swagger-ui .scheme-container .schemes>label{
    color:var(--txt);
  }
  .swagger-ui .opblock-tag small,.swagger-ui .parameter__in,
  .swagger-ui .response-col_description__inner p,.swagger-ui .markdown p,
  .swagger-ui .renderedMarkdown p{ color:var(--muted); }

  /* Enlaces y tipografía markdown */
  .swagger-ui a,.swagger-ui .info a{ color:var(--accent); }
  .swagger-ui .markdown code,.swagger-ui .renderedMarkdown code{
    background:var(--code-bg); color:#8fd3ff; }

  /* Contenedor de esquema (servers/auth) */
  .swagger-ui .scheme-container{ background:var(--bg2); box-shadow:0 1px 0 var(--border); }
  .swagger-ui select{ background:var(--panel); color:var(--txt);
    border:1px solid var(--border2); }
  .swagger-ui .servers>label select{ background:var(--panel); color:var(--txt); }

  /* Bloques de tags */
  .swagger-ui .opblock-tag{ border-bottom:1px solid var(--border); }
  .swagger-ui .opblock-tag:hover{ background:color-mix(in srgb, var(--panel) 40%, transparent); }

  /* Operaciones */
  .swagger-ui .opblock{ background:var(--panel); border:1px solid var(--border);
    box-shadow:none; margin:0 0 12px; }
  .swagger-ui .opblock .opblock-summary{ border-color:var(--border); }
  .swagger-ui .opblock.opblock-get{ background:rgba(59,130,246,.10); border-color:rgba(59,130,246,.5); }
  .swagger-ui .opblock.opblock-post{ background:rgba(34,160,107,.10); border-color:rgba(34,160,107,.5); }
  .swagger-ui .opblock.opblock-put{ background:rgba(224,142,11,.10); border-color:rgba(224,142,11,.5); }
  .swagger-ui .opblock.opblock-patch{ background:rgba(139,92,246,.10); border-color:rgba(139,92,246,.5); }
  .swagger-ui .opblock.opblock-delete{ background:rgba(229,72,77,.10); border-color:rgba(229,72,77,.5); }

  /* Badges de método (GET/POST/PUT…) con la MISMA paleta de la doc navegable,
     en lugar de los colores chillones por defecto de Swagger */
  .swagger-ui .opblock.opblock-get .opblock-summary-method{ background:#3b82f6; }
  .swagger-ui .opblock.opblock-post .opblock-summary-method{ background:#22a06b; }
  .swagger-ui .opblock.opblock-put .opblock-summary-method{ background:#e08e0b; }
  .swagger-ui .opblock.opblock-patch .opblock-summary-method{ background:#8b5cf6; }
  .swagger-ui .opblock.opblock-delete .opblock-summary-method{ background:#e5484d; }
  .swagger-ui .opblock .opblock-summary-method{ text-shadow:none; font-weight:700; }

  /* Cabeceras de sección, tablas y respuestas */
  .swagger-ui .opblock .opblock-section-header{ background:var(--panel2); box-shadow:none; }
  .swagger-ui .tab-header{ background:transparent; }
  .swagger-ui table thead tr td,.swagger-ui table thead tr th{ border-bottom:1px solid var(--border2); }
  .swagger-ui .parameters-col_description input[type=text]{ background:var(--panel2); }
  .swagger-ui .response-col_status{ color:var(--txt); }
  .swagger-ui .responses-inner{ background:transparent; }
  .swagger-ui .opblock-body pre.microlight,
  .swagger-ui .highlight-code>.microlight,.swagger-ui .body-param__text{
    background:var(--code-bg)!important; color:#d7e0f5!important; }
  .swagger-ui .opblock-body pre.microlight span{ color:inherit; }

  /* Inputs y textareas (Try it out) */
  .swagger-ui input[type=text],.swagger-ui input[type=password],
  .swagger-ui input[type=email],.swagger-ui input[type=file],
  .swagger-ui textarea,.swagger-ui .parameters-col_description select{
    background:var(--panel2); color:var(--txt); border:1px solid var(--border2); }
  .swagger-ui textarea{ color:var(--txt); }
  .swagger-ui .parameter__name{ font-weight:600; }

  /* Botones */
  .swagger-ui .btn{ color:var(--txt); border-color:var(--border2); background:var(--panel2); box-shadow:none; }
  .swagger-ui .btn:hover{ border-color:var(--accent); }
  .swagger-ui .btn.execute{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .swagger-ui .btn.authorize{ color:var(--green); border-color:var(--green); }
  .swagger-ui .btn.authorize svg{ fill:var(--green); }
  .swagger-ui .btn.try-out__btn{ background:var(--panel2); }

  /* Modelos (schemas) */
  .swagger-ui section.models{ background:var(--panel); border:1px solid var(--border); }
  .swagger-ui section.models.is-open h4{ border-bottom:1px solid var(--border); }
  .swagger-ui .model-box{ background:var(--code-bg); }
  .swagger-ui .model .property-row td,.swagger-ui .model .property{ color:var(--muted); }
  .swagger-ui .prop-type{ color:#8fd3ff; }
  .swagger-ui .prop-format,.swagger-ui .model .property.primitive{ color:var(--muted); }

  /* Iconos (flechas de expandir, candado) en claro para verse sobre oscuro */
  .swagger-ui .expand-operation svg,.swagger-ui .model-toggle:after,
  .swagger-ui svg.arrow{ filter:invert(0.85); }
  .swagger-ui .authorization__btn svg{ fill:var(--muted); }

  /* Modal de autorización (Available authorizations) */
  .swagger-ui .dialog-ux .modal-ux{ background:var(--panel); border:1px solid var(--border2); }
  .swagger-ui .dialog-ux .modal-ux-header{ border-bottom:1px solid var(--border); }
  .swagger-ui .dialog-ux .modal-ux-content p,
  .swagger-ui .dialog-ux .modal-ux-content li,
  .swagger-ui .dialog-ux .modal-ux-content .markdown p,
  .swagger-ui .dialog-ux .modal-ux-content .scope-def{ color:var(--muted); }
  .swagger-ui .dialog-ux .modal-ux-content h4,
  .swagger-ui .dialog-ux .modal-ux-content label{ color:var(--txt); }
  .swagger-ui .dialog-ux .modal-ux-content code{ background:var(--code-bg); color:#8fd3ff; }
  .swagger-ui .dialog-ux .modal-ux-content .auth-container{ border-bottom:1px solid var(--border); }

  /* Loader/errores */
  .swagger-ui .errors-wrapper{ background:rgba(229,72,77,.10); border:1px solid rgba(229,72,77,.4); }
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">Smartsupervisión API <small>Swagger UI · OpenAPI 3.0.3</small></span>
    <a class="tbtn" href="smartsupervision-webservice.html"><span aria-hidden="true">←</span> Documentación</a>
    <a class="tbtn" href="/" target="_top"><span aria-hidden="true">⌂</span> Índice</a>
    <a class="tbtn" href="smartsupervision-openapi.yaml" download><span aria-hidden="true">⤓</span> YAML</a>
  </div>
  <div id="swagger"><div class="loading">Cargando Swagger UI…</div></div>

  <script src="swagger/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="swagger/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: 'smartsupervision-openapi.yaml',
        dom_id: '#swagger',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 3,
        tryItOutEnabled: true,
        persistAuthorization: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
