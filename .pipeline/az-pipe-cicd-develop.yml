# Pipeline Referenciador - fe-processmaker-acz-screens
# Author: @ruben.jimenez@zurich.com
#
# PROPÓSITO: CI + Deploy a DEV. Se ejecuta en cada commit a la rama develop.
# Toda la lógica real está en devops-processmaker.

name: '$(Rev:rr)'

trigger:
  batch: false
  branches:
    include:
    - refs/heads/develop
  paths:
    include:
    - 'pm4-app/**'
    exclude:
    - 'readme*'
    - 'README*'
    - 'Readme*'
    - 'docs/**'
    - '*.md'
    - '.pipeline/*'

resources:
  repositories:
    - repository:                              AppDevOpsRepo
      type:                                    git
      name:                                    LA-CO-FENIX/devops-processmaker
      ref:                                     main

extends:
  template:                                    pipelines/azure/fe-processmaker-acz-screens/azure-pipelines-cicd-develop.yml@AppDevOpsRepo
